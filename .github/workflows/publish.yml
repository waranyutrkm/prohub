name: ProHub daily refresh and Pages
on:
  workflow_dispatch:
  schedule:
    - cron: '30 6 * * *'
  push:
    branches: [main]
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: prohub-pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt 'vectorbt>=0.28,<1' 'plotly==5.24.1'
      - run: python -m unittest -v
      - run: python refresh.py
      - name: Generate SPY and QQQ rotation portfolios
        run: |
          US_PROXY=SPY python -m research.backtest
          US_PROXY=QQQ python -m research.backtest
      - name: Validate rotation data and frontend
        run: |
          python -m unittest -v
          node --check site/rotation.js
          python -c "import json; from pathlib import Path; [json.loads(Path('site/rotation_'+s+'.json').read_text()) for s in ['SPY','QQQ']]"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Wait for unique Pages artifact to become visible
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          for i in $(seq 1 30); do
            count=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?name=$ARTIFACT" --jq '[.artifacts[] | select(.expired == false)] | length')
            if [ "$count" = 1 ]; then exit 0; fi
            sleep 5
          done
          echo 'Expected one available Pages artifact' >&2
          exit 1
      - uses: actions/deploy-pages@v4
        id: deploy
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
